name: 🫣 Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: assembleWebsiteFullDebug
    steps:
    - name: 🥏 Checkout
      uses: actions/checkout@v6
    - name: ☕️ JDKv17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: ⚡️ +x gradlew
      run: chmod +x gradlew
    - name: 🎪 Secrets
      if: success()
      # TODO: override iff it doesn't exist
      # developers.google.com/android/guides/google-services-plugin#adding_the_json_file
      run: |
        mkdir -p app/src/debug
        echo "${GSCV_TEST_JSON}" > app/src/debug/google-services.json
        # expected: l:29 w:45 m:691
        wc -lwm app/src/debug/google-services.json
        if [ -z "$GSCV_TEST_JSON" ]; then
          echo "VARIANT=assembleFdroidFullDebug" >> "$GITHUB_ENV"
        fi
      env:
        GSCV_TEST_JSON: ${{ secrets.GOOGLE_SERVICES_TEST_JSON }}
    - name: 🧹 Android lint
      if: success()
      run: ./gradlew lint
    - name: 🚂 Assemble installable HARES APK
      if: success()
      run: |
        ./gradlew \
          ${VARIANT} \
          --info \
          --warning-mode all
    - name: 📦 Upload installable HARES universal APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: HARES-ANDROID-UNIVERSAL-APK
        path: app/build/outputs/apk/**/app-*-universal-debug.apk
        if-no-files-found: error
        retention-days: 14
    - name: 🧪 Run upstream unit tests (non-blocking for APK delivery)
      if: success()
      continue-on-error: true
      run: |
        TEST_VARIANT="${VARIANT/assemble/test}UnitTest"
        ./gradlew "$TEST_VARIANT" --continue
