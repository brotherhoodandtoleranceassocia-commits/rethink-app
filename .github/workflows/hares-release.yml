name: HARES Android Release (no signing secrets)

on:
  workflow_dispatch:
  push:
    tags:
      - "hares-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build HARES phone APK without repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build optimized Android release APK (unsigned)
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleFdroidFullRelease -PwebsiteDegoogled=true --no-configuration-cache --stacktrace
          APK="$(find app/build/outputs/apk/fdroid/full/release -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Universal HARES APK was not generated"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/HARES-Android-Release-UNSIGNED.apk
          echo "APK_PATH=release-output/HARES-Android-Release-UNSIGNED.apk" >> "$GITHUB_ENV"

      - name: Verify APK package and confirm unsigned status
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK_PATH" | grep -F "package: name='com.hares.security'"
          if "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo "::error::Expected an unsigned APK, but a signature was detected"
            exit 1
          fi
          echo "Verified: APK package is HARES and the APK is intentionally unsigned."
          echo "::warning::Unsigned APK cannot be installed on Android. A permanent signing key is required for an installable release."

      - name: Publish unsigned release build
        uses: actions/upload-artifact@v4
        with:
          name: HARES-Android-Release-UNSIGNED
          path: release-output/HARES-Android-Release-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30
