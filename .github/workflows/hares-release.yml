name: HARES Android Release (ephemeral signing, no secrets)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "hares-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and sign HARES Android phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build optimized Android phone release
        env:
          VERSION_CODE: '75'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleFdroidFullRelease -PwebsiteDegoogled=true --no-configuration-cache --stacktrace
          APK="$(find app/build/outputs/apk/fdroid/full/release -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Universal HARES phone APK was not generated"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p release-output
          cp "$APK" release-output/HARES-Android-Release-unsigned.apk
          echo "APK_PATH=release-output/HARES-Android-Release-unsigned.apk" >> "$GITHUB_ENV"

      - name: Create one-time signing key (no repository secrets)
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/hares-one-time.jks" \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -alias hares-one-time \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=HARES Android Release, OU=HARES, O=HARES, C=JO"
          echo "::add-mask::$STORE_PASS"
          echo "HARES_SIGNING_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "HARES_KEYSTORE=$RUNNER_TEMP/hares-one-time.jks" >> "$GITHUB_ENV"

      - name: Align and sign APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK_PATH" release-output/HARES-Android-Release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HARES_KEYSTORE" \
            --ks-key-alias hares-one-time \
            --ks-pass "pass:$HARES_SIGNING_PASSWORD" \
            --key-pass "pass:$HARES_SIGNING_PASSWORD" \
            --out release-output/HARES-Android-Release.apk \
            release-output/HARES-Android-Release-aligned.apk
          rm -f release-output/HARES-Android-Release-unsigned.apk release-output/HARES-Android-Release-aligned.apk

      - name: Verify signed APK and package identity
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          AAPT="$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-output/HARES-Android-Release.apk
          "$AAPT" dump badging release-output/HARES-Android-Release.apk | grep -F "package: name='com.hares.security'"
          sha256sum release-output/HARES-Android-Release.apk | tee release-output/SHA256SUMS.txt

      - name: Publish installable one-time-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HARES-Android-Release
          path: |
            release-output/HARES-Android-Release.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
